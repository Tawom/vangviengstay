{% extends 'base.html' %}

{% block title %}Reset Password - Vang Vieng Stay{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        <div class="text-center mb-8">
            <svg class="w-12 h-12 mx-auto text-blue-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
            </svg>
            <h2 class="text-2xl font-bold text-gray-900">Reset Your Password</h2>
            <p class="text-gray-600 mt-2 text-sm">Enter the email address associated with your account, and we'll send you a link to reset your password.</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">Email Address</label>
                <input type="email" name="email" required 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="you@example.com">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="{% url 'login' %}" class="text-sm text-gray-600 hover:text-blue-600 font-medium flex items-center justify-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
