<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Form Submission</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f3f4f6;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f3f4f6; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    
                    <!-- Header -->
                    <tr>
                        <td style="background-color: #1f2937; padding: 30px; text-align: center;">
                            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: bold;">New Contact Form Submission</h1>
                            <p style="color: #9ca3af; margin: 10px 0 0 0; font-size: 14px;">Vang Vieng Stay</p>
                        </td>
                    </tr>
                    
                    <!-- Body -->
                    <tr>
                        <td style="padding: 40px 30px;">
                            <table width="100%" cellpadding="10" cellspacing="0" style="border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 20px;">
                                <tr>
                                    <td style="background-color: #f9fafb; color: #6b7280; font-size: 14px; font-weight: bold; width: 120px;">Name:</td>
                                    <td style="color: #1f2937; font-size: 14px;">{{ name }}</td>
                                </tr>
                                <tr>
                                    <td style="background-color: #f9fafb; color: #6b7280; font-size: 14px; font-weight: bold;">Email:</td>
                                    <td style="color: #1f2937; font-size: 14px;"><a href="mailto:{{ email }}" style="color: #2563eb; text-decoration: none;">{{ email }}</a></td>
                                </tr>
                                <tr>
                                    <td style="background-color: #f9fafb; color: #6b7280; font-size: 14px; font-weight: bold;">Subject:</td>
                                    <td style="color: #1f2937; font-size: 14px;">{{ subject }}</td>
                                </tr>
                            </table>
                            
                            <h3 style="color: #1f2937; font-size: 16px; margin: 20px 0 10px 0;">Message:</h3>
                            <div style="background-color: #f9fafb; padding: 20px; border-radius: 8px; color: #4b5563; font-size: 14px; line-height: 1.6;">
                                {{ message|linebreaks }}
                            </div>
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #f9fafb; padding: 20px; text-align: center; border-top: 1px solid #e5e7eb;">
                            <p style="color: #9ca3af; font-size: 12px; margin: 0;">
                                This email was sent from the Vang Vieng Stay contact form.
                            </p>
                        </td>
                    </tr>
                    
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
