{% extends 'base.html' %}

{% block title %}{{ title }} - Vang Vieng Stay{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-12">
    <a href="{% url 'owner_dashboard' %}" class="inline-flex items-center text-gray-600 hover:text-green-600 mb-6 font-medium">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Dashboard
    </a>

    <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">{{ title }}</h1>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="mt-8 flex gap-4">
                <button type="submit" class="flex-1 bg-green-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-700 transition shadow-md">
                    Save Tour
                </button>
                <a href="{% url 'owner_dashboard' %}" class="flex-1 text-center bg-gray-200 text-gray-700 font-bold py-3 px-6 rounded-lg hover:bg-gray-300 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    /* Style the form paragraphs generated by Django */
    form p {
        margin-bottom: 1.5rem;
    }
    form label {
        display: block;
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.5rem;
    }
    form input[type="text"],
    form input[type="number"],
    form input[type="url"],
    form input[type="time"],
    form textarea,
    form select {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    form input:focus,
    form textarea:focus,
    form select:focus {
        border-color: #16a34a;
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
    }
    form .helptext {
        display: block;
        font-size: 0.875rem;
        color: #6b7280;
        margin-top: 0.25rem;
    }
    form ul.errorlist {
        color: #dc2626;
        font-size: 0.875rem;
        margin-top: 0.25rem;
        list-style-type: none;
        padding-left: 0;
    }
</style>
{% endblock %}
